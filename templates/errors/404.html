<!DOCTYPE html>
<html lang="en">
<head>
  <title>Page Not Found - {{ app_name }}</title>
  {% include "partials/head.html" %}
</head>
<body>
{% import "partials/icons.html" as icon %}
<div class="auth-shell">
  <div class="auth-panel" style="flex:1;">
    <div class="auth-form-wrap text-center">
      <div class="stat-icon icon-tone-primary mb-3" style="width:56px;height:56px;margin:0 auto 18px;">{{ icon.search() }}</div>
      <h1>404 - Page Not Found</h1>
      <p class="auth-sub">This page doesn't exist or may have moved.</p>
      <a href="{{ url_for('public.landing') }}" class="btn btn-primary">Go Home</a>
    </div>
  </div>
</div>
</body>
</html>
