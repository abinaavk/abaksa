<!DOCTYPE html>
<html lang="en">
<head>
  <title>Something Went Wrong - {{ app_name }}</title>
  {% include "partials/head.html" %}
</head>
<body>
{% import "partials/icons.html" as icon %}
<div class="auth-shell">
  <div class="auth-panel" style="flex:1;">
    <div class="auth-form-wrap text-center">
      <div class="stat-icon icon-tone-warning mb-3" style="width:56px;height:56px;margin:0 auto 18px;">{{ icon.alerttriangle() }}</div>
      <h1>500 - Something Went Wrong</h1>
      <p class="auth-sub">An unexpected error occurred. Please try again.</p>
      <a href="{{ url_for('public.landing') }}" class="btn btn-primary">Go Home</a>
    </div>
  </div>
</div>
</body>
</html>
